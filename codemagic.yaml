# Codemagic CI — Solara iOS → TestFlight
# https://docs.codemagic.io/
#
# Prerequisites (Codemagic UI):
# 1. Connect this repo
# 2. Team integrations → Developer Portal / App Store Connect API key
#    - Name the key exactly as integrations.app_store_connect below (Solara)
#    - Key needs App Manager access
# 3. App exists in App Store Connect with bundle id com.solara.weather
# 4. Optional Application → Environment variables:
#      VITE_API_BASE = https://solaraweather.com
#
# After each successful ios-app-store build, the IPA is uploaded to
# App Store Connect / TestFlight via the connected integration.

workflows:
  ios-app-store:
    name: Solara iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Must match the App Store Connect API key name in Codemagic integrations

    environment:
      vars:
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web app + Capacitor iOS sync
        script: |
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build
          npx cap sync ios

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    # Upload IPA to App Store Connect / TestFlight after a successful build
    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        # Use the API key from integrations.app_store_connect above
        auth: integration

        # Upload the IPA and submit the build to TestFlight
        # (post-processing; does not consume extra build minutes)
        submit_to_testflight: true

        # Do not auto-submit for App Store review
        submit_to_app_store: false

        # Optional: add TestFlight beta group names once you create them
        # beta_groups:
        #   - Internal Testers

  # Compile-only check (no signing / no upload)
  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build web + sync
        script: |
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm ci || npm install
          npm run build
          npx cap sync ios
      - name: Compile for iOS Simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
