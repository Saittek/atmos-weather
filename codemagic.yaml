# Codemagic — Solara iOS → TestFlight → App Store
# Bundle ID: com.solara.weather
# Integration name: Solara
#
# Signing strategy:
# - Generate a private key on the build Mac each run
# - If Apple already has max Distribution certs (and we have no key for them),
#   delete those Distribution certs via API, then create a new one with our key
# - Create/fetch App Store provisioning profile for com.solara.weather
#
# Note: Deleting Distribution certs only affects NEW uploads, not apps already
# on the store. Safe for teams that only ship via this Codemagic pipeline.

workflows:
  ios-testflight:
    name: Solara → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    # Auto-build TestFlight when main is updated (enable webhook in Codemagic UI).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        # WidgetKit extension (Home Screen → Add Widget)
        BUNDLE_ID_WIDGET: com.solara.weather.widget
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Ship preflight (entitlements + Apple notes)
        script: |
          set -euo pipefail
          echo "=== Solara iOS preflight ==="
          echo "Bundle IDs: $BUNDLE_ID + $BUNDLE_ID_WIDGET"
          echo "App Group: group.com.solara.weather"
          echo "REQUIRED on Apple Developer before archive succeeds:"
          echo "  1) App Group group.com.solara.weather"
          echo "  2) App ID $BUNDLE_ID: App Groups + Push Notifications"
          echo "  3) App ID $BUNDLE_ID_WIDGET: App Groups"
          echo "  4) App Store Connect app record for $BUNDLE_ID"
          echo "See docs/SHIP_NOW.md"
          test -f ios/App/App/App.entitlements
          grep -q 'aps-environment' ios/App/App/App.entitlements
          grep -q 'group.com.solara.weather' ios/App/App/App.entitlements
          grep -q 'group.com.solara.weather' ios/App/SolaraWidget/SolaraWidget.entitlements
          grep -q 'remote-notification' ios/App/App/Info.plist || true
          echo "Entitlements OK"

      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          set -euo pipefail
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios
          # Rewrite CapApp-SPM for modern SwiftPM package identities (Xcode 26).
          # Capacitor's generated name: "CapacitorApp" does not match path identity "app".
          node scripts/fix-ios-spm-paths.mjs
          echo "=== Resolve Swift packages (fail early if SPM is broken) ==="
          cd ios/App
          set +e
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            2>&1 | tee /tmp/spm-resolve.log
          SPM_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$SPM_STATUS" -ne 0 ]; then
            echo "=== SPM resolve FAILED ==="
            tail -n 80 /tmp/spm-resolve.log || true
            # Decode package activity logs if present
            find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Logs/Package/*.xcactivitylog" 2>/dev/null \
              | tail -n 4 | while read -r log; do
                echo "----- decode $log -----"
                # xcactivitylog is a gzip stream of SLF text
                gzip -dc "$log" 2>/dev/null | strings | grep -iE "error|fail|unable|missing|invalid|package" | tail -n 40 || true
              done
            exit "$SPM_STATUS"
          fi
          echo "SPM resolve OK"

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"

          echo "Generating Distribution private key..."
          openssl genrsa -out "$KEY_FILE" 2048
          openssl rsa -in "$KEY_FILE" -check -noout
          echo "Private key OK"

          delete_distribution_certs() {
            echo "Listing Apple Distribution certificates..."
            python3 << 'PY'
          import json, subprocess, sys

          def run(cmd):
              try:
                  return subprocess.check_output(cmd, stderr=subprocess.STDOUT, text=True)
              except subprocess.CalledProcessError as e:
                  print(e.output or str(e), file=sys.stderr)
                  return None

          raw = run(["app-store-connect", "certificates", "list", "--json"])
          if not raw:
              raw = run(["app-store-connect", "certificates", "list", "--type", "IOS_DISTRIBUTION", "--json"])
          if not raw:
              print("Could not list certificates as JSON", file=sys.stderr)
              sys.exit(2)

          print("Raw list (truncated):", raw[:1500])
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("Not JSON; trying line parse")
              # fallback: lines that look like IDs
              import re
              ids = re.findall(r"\b([A-Z0-9]{10,})\b", raw)
              data = [{"id": i} for i in ids]

          ids = []

          def walk(o):
              if isinstance(o, dict):
                  cid = o.get("id")
                  attrs = o.get("attributes") or {}
                  ctype = str(
                      attrs.get("certificateType")
                      or o.get("certificateType")
                      or o.get("type")
                      or ""
                  ).upper()
                  # Match distribution certs only
                  if cid and (
                      "DISTRIBUTION" in ctype
                      or ctype in ("", "CERTIFICATES")
                      or o.get("type") == "certificates"
                  ):
                      # If type is certificates resource, check attributes
                      if o.get("type") == "certificates" or "DISTRIBUTION" in ctype:
                          if "DEVELOPMENT" not in ctype:
                              if "DISTRIBUTION" in ctype or o.get("type") == "certificates":
                                  # Prefer explicit DISTRIBUTION; for bare certificate resources include if attr says so
                                  if "DISTRIBUTION" in ctype or (
                                      o.get("type") == "certificates"
                                      and "DEVELOPMENT" not in str(attrs).upper()
                                      and "DISTRIBUTION" in str(attrs).upper()
                                  ):
                                      ids.append(cid)
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for i in o:
                      walk(i)

          walk(data)

          # Deduplicate preserving order
          seen = set()
          uniq = []
          for i in ids:
              if i not in seen:
                  seen.add(i)
                  uniq.append(i)

          # If walk found nothing but list is array of cert objects with id only
          if not uniq and isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and item.get("id"):
                      uniq.append(item["id"])

          print(f"Distribution cert ids to delete: {uniq}")
          if not uniq:
              sys.exit(3)

          failed = 0
          for cid in uniq:
              print(f"Deleting certificate {cid} ...")
              r = subprocess.call(["app-store-connect", "certificates", "delete", cid])
              if r != 0:
                  print(f"Delete failed for {cid} (exit {r})")
                  failed += 1
          sys.exit(0 if failed < len(uniq) else 4)
          PY
          }

          # Drop stale App Store profiles so --create picks up current App ID capabilities
          # (App Groups, etc.). Avoids archive failing on outdated profile entitlements.
          delete_app_store_profiles() {
            local BID="$1"
            echo "Deleting existing IOS_APP_STORE profiles for $BID (if any)..."
            python3 - "$BID" << 'PY' || true
          import json, subprocess, sys
          bid = sys.argv[1]
          def run(cmd):
              try:
                  return subprocess.check_output(cmd, stderr=subprocess.STDOUT, text=True)
              except subprocess.CalledProcessError as e:
                  print(e.output or str(e), file=sys.stderr)
                  return None
          raw = run(["app-store-connect", "profiles", "list", "--json"]) or run(
              ["app-store-connect", "profiles", "list", "--type", "IOS_APP_STORE", "--json"]
          )
          if not raw:
              print("Could not list profiles; skipping delete")
              sys.exit(0)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("profiles list not JSON; skip")
              sys.exit(0)
          ids = []
          def walk(o):
              if isinstance(o, dict):
                  attrs = o.get("attributes") or {}
                  name = str(attrs.get("name") or o.get("name") or "")
                  ptype = str(attrs.get("profileType") or attrs.get("type") or "").upper()
                  cid = o.get("id")
                  blob = json.dumps(o).upper()
                  if cid and ("APP_STORE" in ptype or "APP_STORE" in blob or "IOS_APP_STORE" in blob):
                      if bid.upper() in blob or bid.replace(".", "").upper() in blob or True:
                          # Prefer profiles that mention the bundle id in the payload
                          if bid in json.dumps(o) or "APP_STORE" in ptype or "IOS_APP_STORE" in ptype:
                              if bid in json.dumps(o):
                                  ids.append(cid)
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for i in o:
                      walk(i)
          walk(data)
          seen = []
          for i in ids:
              if i not in seen:
                  seen.append(i)
          print(f"Profile ids to delete for {bid}: {seen}")
          for cid in seen:
              print(f"  delete profile {cid}")
              subprocess.call(["app-store-connect", "profiles", "delete", cid])
          PY
          }

          fetch_files() {
            local BID="$1"
            delete_app_store_profiles "$BID"
            echo "Fetching/creating signing files for $BID ..."
            app-store-connect fetch-signing-files "$BID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key="@file:$KEY_FILE"
          }

          fetch_with_retry() {
            local BID="$1"
            set +e
            OUT=$(fetch_files "$BID" 2>&1)
            STATUS=$?
            set -e
            echo "$OUT"
            if [ $STATUS -ne 0 ]; then
              if echo "$OUT" | grep -qiE 'already have|maximum|limit|409|private key|Distribution certificate'; then
                echo "Certificate slot full or unusable — deleting existing Distribution certs..."
                delete_distribution_certs || true
                echo "Retrying fetch-signing-files for $BID ..."
                fetch_files "$BID"
              else
                exit $STATUS
              fi
            fi
          }

          fetch_with_retry "$BUNDLE_ID"
          # Home Screen WidgetKit extension (must exist in Apple Developer portal)
          if [ -n "${BUNDLE_ID_WIDGET:-}" ]; then
            fetch_with_retry "$BUNDLE_ID_WIDGET" || {
              echo "WARNING: Could not fetch signing for widget $BUNDLE_ID_WIDGET"
              echo "Create App ID com.solara.weather.widget + App Group group.com.solara.weather"
              echo "See docs/IOS_WIDGET.md"
              exit 1
            }
          fi

          echo "Signing files ready"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: |
          set -euo pipefail
          xcode-project use-profiles
          cd "$XCODE_WORKSPACE_DIR"
          echo "=== Post use-profiles: CODE_SIGN / profiles in pbxproj ==="
          grep -E "CODE_SIGN_|PROVISIONING_PROFILE|PRODUCT_BUNDLE|DEVELOPMENT_TEAM|ProvisioningStyle" \
            App.xcodeproj/project.pbxproj | sort -u || true
          echo "=== Profile bundle IDs (decoded) ==="
          python3 << 'PY'
          import os, plistlib, subprocess, glob, sys
          dirs = [
              os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles"),
              os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles"),
          ]
          found = []
          for d in dirs:
              for path in glob.glob(os.path.join(d, "*.mobileprovision")):
                  try:
                      raw = subprocess.check_output(
                          ["security", "cms", "-D", "-i", path], stderr=subprocess.DEVNULL
                      )
                      pl = plistlib.loads(raw)
                      name = pl.get("Name", "?")
                      app_id = (pl.get("Entitlements") or {}).get("application-identifier", "?")
                      groups = (pl.get("Entitlements") or {}).get("com.apple.security.application-groups", [])
                      aps = (pl.get("Entitlements") or {}).get("aps-environment")
                      found.append((name, app_id, groups, aps, path))
                      print(f"  {name}")
                      print(f"    app-id: {app_id}")
                      print(f"    groups: {groups}")
                      print(f"    aps: {aps}")
                  except Exception as e:
                      print(f"  decode fail {path}: {e}")
          need = ["com.solara.weather", "com.solara.weather.widget"]
          ids = " ".join(x[1] for x in found)
          missing = [b for b in need if b not in ids]
          if missing:
              print(f"ERROR: No App Store profile covering: {missing}", file=sys.stderr)
              print("Create App IDs + App Group group.com.solara.weather in Apple Developer.", file=sys.stderr)
              sys.exit(1)
          print("Profiles cover main app + widget OK")
          PY

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$XCODE_WORKSPACE_DIR"
          mkdir -p build/ios/ipa /tmp/xcodebuild_logs

          echo "=== Code signing identities ==="
          security find-identity -v -p codesigning || true
          echo "=== Bundle / team / sign settings in project ==="
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|PROVISIONING_PROFILE" \
            App.xcodeproj/project.pbxproj | sort -u || true

          ARCHIVE_PATH="$PWD/build/ios/App.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"
          EXPORT_PLIST="$PWD/build/ios/ExportOptions.plist"
          LOG=/tmp/xcodebuild_logs/archive_full.log

          # Raw xcodebuild so the real error is in Codemagic logs (not buried by wrappers).
          # use-profiles already applied Manual + profile specifiers per target.
          set +e
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=94Y9ZFUHFD \
            2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set +o pipefail
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=== ARCHIVE FAILED (exit $STATUS) — error lines ==="
            grep -iE "error:|fatal error|Provisioning|CodeSign|No profiles|requires a provisioning|entitlement|App Group|does not support|failed with|undefined symbol|cannot find|package |SwiftCompile|Command .* failed|errSec|identity" \
              "$LOG" | tail -n 100 || true
            echo ""
            echo "=== Last 100 lines of archive log ==="
            tail -n 100 "$LOG" || true
            echo ""
            echo "Common fixes for exit 65:"
            echo "  1) SPM: CapApp-SPM package identities (scripts/fix-ios-spm-paths.mjs)"
            echo "  2) App ID com.solara.weather.widget + App Group group.com.solara.weather"
            echo "  3) Codemagic 'Solara' integration can create App Store profiles for BOTH bundle IDs"
            echo "  4) Release uses Apple Distribution (not iPhone Developer)"
            echo "  5) Profile missing App Groups: enable group.com.solara.weather on both App IDs"
            echo "  6) Profile missing Push/aps-environment: either enable Push on App ID OR remove aps-environment from App.entitlements"
            exit "$STATUS"
          fi

          echo "=== Archive OK — writing ExportOptions + exporting IPA ==="
          EXPORT_PLIST_PATH="$EXPORT_PLIST" python3 << 'PY'
          import os, plistlib, subprocess, glob
          team = "94Y9ZFUHFD"
          mapping = {}
          for d in [
              os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles"),
              os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles"),
          ]:
              for path in glob.glob(os.path.join(d, "*.mobileprovision")):
                  try:
                      raw = subprocess.check_output(
                          ["security", "cms", "-D", "-i", path], stderr=subprocess.DEVNULL
                      )
                      pl = plistlib.loads(raw)
                      app_id = (pl.get("Entitlements") or {}).get("application-identifier", "")
                      if "." in app_id:
                          bid = app_id.split(".", 1)[1]
                          mapping[bid] = pl.get("Name") or ""
                  except Exception as e:
                      print("skip", path, e)
          out = {
              "method": "app-store",
              "teamID": team,
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "uploadSymbols": True,
              "provisioningProfiles": {
                  "com.solara.weather": mapping.get("com.solara.weather", ""),
                  "com.solara.weather.widget": mapping.get("com.solara.weather.widget", ""),
              },
          }
          path = os.environ["EXPORT_PLIST_PATH"]
          with open(path, "wb") as f:
              plistlib.dump(out, f)
          print("Wrote", path)
          print("profile map:", mapping)
          PY

          set +e
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            2>&1 | tee /tmp/xcodebuild_logs/export_full.log
          EXP_STATUS=${PIPESTATUS[0]}
          set +o pipefail
          set -e

          if [ "$EXP_STATUS" -ne 0 ]; then
            echo "=== EXPORT FAILED ==="
            grep -iE "error:|Error |failed|profile|sign" /tmp/xcodebuild_logs/export_full.log | tail -n 40 || true
            tail -n 80 /tmp/xcodebuild_logs/export_full.log || true
            exit "$EXP_STATUS"
          fi

          ls -la "$EXPORT_PATH" || true
          echo "IPA export OK"

      - name: Ensure App Store Connect app exists
        script: |
          set -euo pipefail
          echo "Checking App Store Connect for $BUNDLE_ID ..."
          set +e
          LIST=$(app-store-connect apps list 2>&1)
          set -e
          echo "$LIST" | head -n 60
          if echo "$LIST" | grep -qi "$BUNDLE_ID\|Solara"; then
            echo "App record appears present"
            exit 0
          fi
          echo "WARNING: Could not confirm app for $BUNDLE_ID."
          echo "If publish fails with altool error 19, create the app at:"
          echo "  https://appstoreconnect.apple.com → My Apps → + → Solara / com.solara.weather"
          # Do not fail here if list format is odd; publish step will fail clearly

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-app-store-submit:
    name: Solara → App Store review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Solara
    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        BUNDLE_ID_WIDGET: com.solara.weather.widget
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci || npm install
      - name: Build web + Capacitor iOS
        script: |
          set -euo pipefail
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios
          node scripts/fix-ios-spm-paths.mjs
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Set up keychain
        script: keychain initialize
      - name: Automatic code signing
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"
          openssl genrsa -out "$KEY_FILE" 2048
          fetch_bid() {
            app-store-connect fetch-signing-files "$1" --type IOS_APP_STORE --create --certificate-key="@file:$KEY_FILE"
          }
          set +e
          OUT=$(fetch_bid "$BUNDLE_ID" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            python3 - <<'PY' || true
          import json, subprocess, sys
          raw = subprocess.check_output(["app-store-connect", "certificates", "list", "--json"], text=True)
          data = json.loads(raw)
          ids = []
          def walk(o):
            if isinstance(o, dict):
              if o.get("id") and ("DISTRIBUTION" in str(o).upper()):
                if o.get("type") == "certificates" or "certificateType" in str(o.get("attributes", {})):
                  ids.append(o["id"])
              for v in o.values(): walk(v)
            elif isinstance(o, list):
              for i in o: walk(i)
          walk(data)
          for i in dict.fromkeys(ids):
            print("delete", i)
            subprocess.call(["app-store-connect", "certificates", "delete", i])
          PY
            fetch_bid "$BUNDLE_ID"
          fi
          fetch_bid "$BUNDLE_ID_WIDGET"
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing to Xcode project
        script: xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$XCODE_WORKSPACE_DIR"
          mkdir -p build/ios/ipa /tmp/xcodebuild_logs
          ARCHIVE_PATH="$PWD/build/ios/App.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"
          EXPORT_PLIST="$PWD/build/ios/ExportOptions.plist"
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=94Y9ZFUHFD \
            2>&1 | tee /tmp/xcodebuild_logs/archive_full.log
          EXPORT_PLIST_PATH="$EXPORT_PLIST" python3 << 'PY'
          import os, plistlib, subprocess, glob
          mapping = {}
          for d in [
              os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles"),
              os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles"),
          ]:
              for path in glob.glob(os.path.join(d, "*.mobileprovision")):
                  try:
                      raw = subprocess.check_output(["security", "cms", "-D", "-i", path], stderr=subprocess.DEVNULL)
                      pl = plistlib.loads(raw)
                      app_id = (pl.get("Entitlements") or {}).get("application-identifier", "")
                      if "." in app_id:
                          mapping[app_id.split(".", 1)[1]] = pl.get("Name") or ""
                  except Exception:
                      pass
          out = {
              "method": "app-store",
              "teamID": "94Y9ZFUHFD",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "uploadSymbols": True,
              "provisioningProfiles": {
                  "com.solara.weather": mapping.get("com.solara.weather", ""),
                  "com.solara.weather.widget": mapping.get("com.solara.weather.widget", ""),
              },
          }
          with open(os.environ["EXPORT_PLIST_PATH"], "wb") as f:
              plistlib.dump(out, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true

  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build
        script: |
          export CAPACITOR=1
          npm ci || npm install
          npm run build -- --base ./
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
