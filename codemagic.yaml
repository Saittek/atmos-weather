# Codemagic — Solara iOS → TestFlight → App Store
# Bundle ID: com.solara.weather
# Integration name: Solara
#
# Signing strategy:
# - Generate a private key on the build Mac each run
# - If Apple already has max Distribution certs (and we have no key for them),
#   delete those Distribution certs via API, then create a new one with our key
# - Create/fetch App Store provisioning profile for com.solara.weather
#
# Note: Deleting Distribution certs only affects NEW uploads, not apps already
# on the store. Safe for teams that only ship via this Codemagic pipeline.

workflows:
  ios-testflight:
    name: Solara → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    # Auto-build TestFlight when main is updated (enable webhook in Codemagic UI).
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        # WidgetKit extension (Home Screen → Add Widget)
        BUNDLE_ID_WIDGET: com.solara.weather.widget
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          set -euo pipefail
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios
          # Rewrite CapApp-SPM for modern SwiftPM package identities (Xcode 26).
          # Capacitor's generated name: "CapacitorApp" does not match path identity "app".
          node scripts/fix-ios-spm-paths.mjs
          echo "=== Resolve Swift packages (fail early if SPM is broken) ==="
          cd ios/App
          set +e
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            2>&1 | tee /tmp/spm-resolve.log
          SPM_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$SPM_STATUS" -ne 0 ]; then
            echo "=== SPM resolve FAILED ==="
            tail -n 80 /tmp/spm-resolve.log || true
            # Decode package activity logs if present
            find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Logs/Package/*.xcactivitylog" 2>/dev/null \
              | tail -n 4 | while read -r log; do
                echo "----- decode $log -----"
                # xcactivitylog is a gzip stream of SLF text
                gzip -dc "$log" 2>/dev/null | strings | grep -iE "error|fail|unable|missing|invalid|package" | tail -n 40 || true
              done
            exit "$SPM_STATUS"
          fi
          echo "SPM resolve OK"

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"

          echo "Generating Distribution private key..."
          openssl genrsa -out "$KEY_FILE" 2048
          openssl rsa -in "$KEY_FILE" -check -noout
          echo "Private key OK"

          delete_distribution_certs() {
            echo "Listing Apple Distribution certificates..."
            python3 << 'PY'
          import json, subprocess, sys

          def run(cmd):
              try:
                  return subprocess.check_output(cmd, stderr=subprocess.STDOUT, text=True)
              except subprocess.CalledProcessError as e:
                  print(e.output or str(e), file=sys.stderr)
                  return None

          raw = run(["app-store-connect", "certificates", "list", "--json"])
          if not raw:
              raw = run(["app-store-connect", "certificates", "list", "--type", "IOS_DISTRIBUTION", "--json"])
          if not raw:
              print("Could not list certificates as JSON", file=sys.stderr)
              sys.exit(2)

          print("Raw list (truncated):", raw[:1500])
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print("Not JSON; trying line parse")
              # fallback: lines that look like IDs
              import re
              ids = re.findall(r"\b([A-Z0-9]{10,})\b", raw)
              data = [{"id": i} for i in ids]

          ids = []

          def walk(o):
              if isinstance(o, dict):
                  cid = o.get("id")
                  attrs = o.get("attributes") or {}
                  ctype = str(
                      attrs.get("certificateType")
                      or o.get("certificateType")
                      or o.get("type")
                      or ""
                  ).upper()
                  # Match distribution certs only
                  if cid and (
                      "DISTRIBUTION" in ctype
                      or ctype in ("", "CERTIFICATES")
                      or o.get("type") == "certificates"
                  ):
                      # If type is certificates resource, check attributes
                      if o.get("type") == "certificates" or "DISTRIBUTION" in ctype:
                          if "DEVELOPMENT" not in ctype:
                              if "DISTRIBUTION" in ctype or o.get("type") == "certificates":
                                  # Prefer explicit DISTRIBUTION; for bare certificate resources include if attr says so
                                  if "DISTRIBUTION" in ctype or (
                                      o.get("type") == "certificates"
                                      and "DEVELOPMENT" not in str(attrs).upper()
                                      and "DISTRIBUTION" in str(attrs).upper()
                                  ):
                                      ids.append(cid)
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for i in o:
                      walk(i)

          walk(data)

          # Deduplicate preserving order
          seen = set()
          uniq = []
          for i in ids:
              if i not in seen:
                  seen.add(i)
                  uniq.append(i)

          # If walk found nothing but list is array of cert objects with id only
          if not uniq and isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and item.get("id"):
                      uniq.append(item["id"])

          print(f"Distribution cert ids to delete: {uniq}")
          if not uniq:
              sys.exit(3)

          failed = 0
          for cid in uniq:
              print(f"Deleting certificate {cid} ...")
              r = subprocess.call(["app-store-connect", "certificates", "delete", cid])
              if r != 0:
                  print(f"Delete failed for {cid} (exit {r})")
                  failed += 1
          sys.exit(0 if failed < len(uniq) else 4)
          PY
          }

          fetch_files() {
            local BID="$1"
            echo "Fetching/creating signing files for $BID ..."
            app-store-connect fetch-signing-files "$BID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key="@file:$KEY_FILE"
          }

          fetch_with_retry() {
            local BID="$1"
            set +e
            OUT=$(fetch_files "$BID" 2>&1)
            STATUS=$?
            set -e
            echo "$OUT"
            if [ $STATUS -ne 0 ]; then
              if echo "$OUT" | grep -qiE 'already have|maximum|limit|409|private key|Distribution certificate'; then
                echo "Certificate slot full or unusable — deleting existing Distribution certs..."
                delete_distribution_certs || true
                echo "Retrying fetch-signing-files for $BID ..."
                fetch_files "$BID"
              else
                exit $STATUS
              fi
            fi
          }

          fetch_with_retry "$BUNDLE_ID"
          # Home Screen WidgetKit extension (must exist in Apple Developer portal)
          if [ -n "${BUNDLE_ID_WIDGET:-}" ]; then
            fetch_with_retry "$BUNDLE_ID_WIDGET" || {
              echo "WARNING: Could not fetch signing for widget $BUNDLE_ID_WIDGET"
              echo "Create App ID com.solara.weather.widget + App Group group.com.solara.weather"
              echo "See docs/IOS_WIDGET.md"
              exit 1
            }
          fi

          echo "Signing files ready"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$XCODE_WORKSPACE_DIR"
          echo "=== Code signing identities ==="
          security find-identity -v -p codesigning || true
          echo "=== Provisioning profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || \
            ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" 2>/dev/null || true
          echo "=== Bundle IDs in project ==="
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj | sort -u || true

          # Shared scheme App.xcscheme archives main app + embedded SolaraWidgetExtension
          set +e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "=== ARCHIVE FAILED (exit $STATUS) — log tails ==="
            find /tmp/xcodebuild_logs -type f 2>/dev/null | while read -r f; do
              echo "----- $f -----"
              tail -n 150 "$f" || true
            done
            # Package resolution failures land here (gzip SLF)
            find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Logs/Package/*.xcactivitylog" 2>/dev/null \
              | tail -n 6 | while read -r log; do
                echo "----- decode package log: $log -----"
                gzip -dc "$log" 2>/dev/null | strings | grep -iE "error|fail|unable|missing|invalid|package|dependency|not found" | tail -n 50 || true
              done
            find /tmp -name "*xcodebuild*" -type f 2>/dev/null | head -n 20 | while read -r f; do
              if grep -qiE "error:|Provisioning|CodeSign|No profiles|failed|undefined|cannot find|package" "$f" 2>/dev/null; then
                echo "----- matches in $f -----"
                grep -iE "error:|Provisioning|CodeSign|No profiles|failed|undefined|cannot find|package" "$f" | tail -n 40 || true
              fi
            done
            echo ""
            echo "Common fixes for exit 65:"
            echo "  1) SPM: CapApp-SPM package identities (scripts/fix-ios-spm-paths.mjs)"
            echo "  2) App ID com.solara.weather.widget + App Group group.com.solara.weather"
            echo "  3) Codemagic 'Solara' integration can create App Store profiles for BOTH bundle IDs"
            exit "$STATUS"
          fi

      - name: Ensure App Store Connect app exists
        script: |
          set -euo pipefail
          echo "Checking App Store Connect for $BUNDLE_ID ..."
          set +e
          LIST=$(app-store-connect apps list 2>&1)
          set -e
          echo "$LIST" | head -n 60
          if echo "$LIST" | grep -qi "$BUNDLE_ID\|Solara"; then
            echo "App record appears present"
            exit 0
          fi
          echo "WARNING: Could not confirm app for $BUNDLE_ID."
          echo "If publish fails with altool error 19, create the app at:"
          echo "  https://appstoreconnect.apple.com → My Apps → + → Solara / com.solara.weather"
          # Do not fail here if list format is odd; publish step will fail clearly

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-app-store-submit:
    name: Solara → App Store review
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Solara
    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        BUNDLE_ID_WIDGET: com.solara.weather.widget
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci || npm install
      - name: Build web + Capacitor iOS
        script: |
          set -euo pipefail
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios
          node scripts/fix-ios-spm-paths.mjs
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Set up keychain
        script: keychain initialize
      - name: Automatic code signing
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"
          openssl genrsa -out "$KEY_FILE" 2048
          fetch_bid() {
            app-store-connect fetch-signing-files "$1" --type IOS_APP_STORE --create --certificate-key="@file:$KEY_FILE"
          }
          set +e
          OUT=$(fetch_bid "$BUNDLE_ID" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            python3 - <<'PY' || true
          import json, subprocess, sys
          raw = subprocess.check_output(["app-store-connect", "certificates", "list", "--json"], text=True)
          data = json.loads(raw)
          ids = []
          def walk(o):
            if isinstance(o, dict):
              if o.get("id") and ("DISTRIBUTION" in str(o).upper()):
                if o.get("type") == "certificates" or "certificateType" in str(o.get("attributes", {})):
                  ids.append(o["id"])
              for v in o.values(): walk(v)
            elif isinstance(o, list):
              for i in o: walk(i)
          walk(data)
          for i in dict.fromkeys(ids):
            print("delete", i)
            subprocess.call(["app-store-connect", "certificates", "delete", i])
          PY
            fetch_bid "$BUNDLE_ID"
          fi
          fetch_bid "$BUNDLE_ID_WIDGET"
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply signing to Xcode project
        script: xcode-project use-profiles
      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true

  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build
        script: |
          export CAPACITOR=1
          npm ci || npm install
          npm run build -- --base ./
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
