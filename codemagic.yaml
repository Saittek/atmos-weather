# Codemagic — Solara iOS → TestFlight → App Store
# Bundle ID: com.solara.weather
# Integration name (must match UI): Solara
#
# FIX for: "Cannot save Signing Certificates without certificate private key"
# ---------------------------------------------------------------------------
# Apple never re-downloads certificate private keys. Codemagic must create the
# cert using a private key YOU store as a secure env var (reused every build).
#
# ONE-TIME setup:
# 1. Generate a key (PowerShell / Git Bash / Mac):
#      openssl genrsa 2048
# 2. Codemagic → your app → Environment variables:
#      Name:   CERTIFICATE_PRIVATE_KEY
#      Value:  full PEM text (-----BEGIN RSA PRIVATE KEY----- ... END-----)
#      Secure: YES
# 3. If Apple says you already have too many Distribution certs (max 3),
#    revoke unused ones at:
#      https://developer.apple.com/account/resources/certificates/list
# 4. Re-run workflow: ios-testflight

workflows:
  ios-testflight:
    name: Solara → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      # Import group that holds CERTIFICATE_PRIVATE_KEY (create group in Codemagic UI)
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (certs + profiles)
        script: |
          set -e
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "============================================================"
            echo "MISSING: CERTIFICATE_PRIVATE_KEY"
            echo ""
            echo "In Codemagic UI (not in GitHub):"
            echo "  1. Open your app → Environment variables"
            echo "  2. Variable group name: app_store_credentials"
            echo "  3. Add variable:"
            echo "       Name: CERTIFICATE_PRIVATE_KEY"
            echo "       Secure: YES"
            echo "       Value: contents of certificate_private_key.pem"
            echo "  4. Ensure group is available to this workflow"
            echo "============================================================"
            exit 1
          fi

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-app-store-submit:
    name: Solara → App Store review
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (certs + profiles)
        script: |
          set -e
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "MISSING CERTIFICATE_PRIVATE_KEY — see ios-testflight workflow comments"
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true

  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm ci || npm install
          npm run build -- --base ./
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
