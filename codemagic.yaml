# Codemagic cloud Mac CI — build Solara for TestFlight / App Store
# Docs: https://docs.codemagic.io/
#
# Setup:
# 1. Push this repo to GitHub/GitLab/Bitbucket
# 2. Sign up at https://codemagic.io and connect the repo
# 3. In Codemagic → Teams → Code signing identities:
#    - Upload App Store Connect API key (or Apple ID + app-specific password)
#    - Or use automatic code signing with your Apple Developer account
# 4. Set environment variables (optional):
#    VITE_API_BASE = https://your-api.example.com
# 5. Start the "ios-app-store" workflow

workflows:
  ios-app-store:
    name: Solara iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Solara # rename to your Codemagic integration name
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solara.weather
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        # If Codemagic expects .xcworkspace after CocoaPods, switch to that path
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.solara.weather"
        APP_STORE_APPLE_ID: "" # numeric App Store Connect app id after first create
      node: v22.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install
      - name: Build web + Capacitor sync
        script: |
          # Optional: export VITE_API_BASE from Codemagic env group
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Submit to TestFlight (set true when ready)
        submit_to_testflight: true
        # submit_to_app_store: false

  # Quick compile check (no upload) — free-tier friendly
  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install & build
        script: |
          npm ci || npm install
          npm run build
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
