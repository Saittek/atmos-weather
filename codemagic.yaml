# Codemagic — Solara iOS → TestFlight → App Store
# https://docs.codemagic.io/
#
# Bundle ID: com.solara.weather
# Integration name (Codemagic UI): must match exactly → Solara
#
# SETUP (once):
# 1. Apple Developer Program ($99/year) — https://developer.apple.com
# 2. App Store Connect → create app "Solara", bundle id com.solara.weather
# 3. App Store Connect → Users and Access → Integrations → App Store Connect API
#    → create key (App Manager) → download .p8 once
# 4. Codemagic.io → Team settings → Integrations → Developer Portal
#    → add key, name it exactly: Solara
# 5. Codemagic → add this GitHub repo → Application settings
#    → optional env: VITE_API_BASE = https://solaraweather.com
# 6. Start workflow: ios-testflight  (first uploads go to TestFlight)
# 7. When ready for public release: run ios-app-store-submit
#    (metadata, screenshots, privacy URL must already be filled in App Store Connect)

workflows:
  # ── Primary: build IPA + upload to TestFlight ─────────────────────────
  ios-testflight:
    name: Solara → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        # Production API for the binary
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS (relative base for native shell)
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (create/manage certs + profiles)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          # Unique build number from Codemagic so every upload is accepted
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        # Use Codemagic integration named "Solara"
        auth: integration
        # Upload IPA → appears in TestFlight after Apple processing
        submit_to_testflight: true
        # Keep false until App Store Connect listing is complete
        submit_to_app_store: false
        # Optional: after you create groups in TestFlight
        # beta_groups:
        #   - Internal Testers

  # ── When listing is ready: same build path + submit for App Store review ─
  ios-app-store-submit:
    name: Solara → App Store review
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Sends the build for App Store review (needs complete metadata first)
        submit_to_app_store: true
        cancel_previous_submissions: true

  # ── Quick compile check (no Apple upload) ─────────────────────────────
  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm ci || npm install
          npm run build -- --base ./
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
