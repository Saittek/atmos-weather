# Codemagic — Solara iOS → TestFlight → App Store
# Bundle ID: com.solara.weather
# Integration name (must match UI): Solara
#
# FIX for: "Cannot save Signing Certificates without certificate private key"
# ---------------------------------------------------------------------------
# Apple never re-downloads certificate private keys. Codemagic must create the
# cert using a private key YOU store as a secure env var (reused every build).
#
# ONE-TIME setup:
# 1. Generate a key (PowerShell / Git Bash / Mac):
#      openssl genrsa 2048
# 2. Codemagic → your app → Environment variables:
#      Name:   CERTIFICATE_PRIVATE_KEY
#      Value:  full PEM text (-----BEGIN RSA PRIVATE KEY----- ... END-----)
#      Secure: YES
# 3. If Apple says you already have too many Distribution certs (max 3),
#    revoke unused ones at:
#      https://developer.apple.com/account/resources/certificates/list
# 4. Re-run workflow: ios-testflight

workflows:
  ios-testflight:
    name: Solara → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      # No required group name — add CERTIFICATE_PRIVATE_KEY_B64 as an
      # Application environment variable (Secure) so all workflows can see it.
      # Optional group (if you use one, import it here):
      # groups:
      #   - app_store_credentials
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (certs + profiles)
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"

          # Debug: which secrets are visible (lengths only, never print secrets)
          echo "Env check:"
          echo "  CERTIFICATE_PRIVATE_KEY_B64 length: ${#CERTIFICATE_PRIVATE_KEY_B64}"
          echo "  CERTIFICATE_PRIVATE_KEY length: ${#CERTIFICATE_PRIVATE_KEY}"

          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ] && [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo ""
            echo "============================================================"
            echo "Codemagic cannot see your signing secret."
            echo ""
            echo "FIX (Application variables — not Team-only, not GitHub):"
            echo "  1. codemagic.io → open THIS app (atmos-weather)"
            echo "  2. Environment variables"
            echo "  3. Add variable to the APPLICATION (not only a Team group"
            echo "     unless that group is listed under environment.groups)"
            echo "  4. Name exactly: CERTIFICATE_PRIVATE_KEY_B64"
            echo "  5. Value: one line from"
            echo "     .codemagic-secrets/certificate_private_key.b64.txt"
            echo "  6. Secure: YES"
            echo "  7. Save, then Start a NEW build"
            echo "============================================================"
            exit 1
          fi

          if [ -n "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "Using CERTIFICATE_PRIVATE_KEY_B64..."
            # strip whitespace/newlines that UI sometimes adds
            echo "$CERTIFICATE_PRIVATE_KEY_B64" | tr -d '\r\n\t ' | base64 --decode > "$KEY_FILE"
          else
            echo "Using CERTIFICATE_PRIVATE_KEY (normalizing newlines)..."
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" \
              | sed 's/\r//g' \
              | sed 's/\\n/\n/g' \
              > "$KEY_FILE"
            echo >> "$KEY_FILE"
          fi

          echo "Key file header: $(head -n 1 "$KEY_FILE")"
          if ! openssl rsa -in "$KEY_FILE" -check -noout 2>/dev/null; then
            if ! openssl pkey -in "$KEY_FILE" -check -noout 2>/dev/null; then
              echo "Decoded key is invalid. Re-paste CERTIFICATE_PRIVATE_KEY_B64 from the .b64.txt file."
              exit 1
            fi
          fi
          echo "Private key OK"

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@file:$KEY_FILE"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-app-store-submit:
    name: Solara → App Store review
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (certs + profiles)
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"

          echo "Env check: B64 len=${#CERTIFICATE_PRIVATE_KEY_B64} PEM len=${#CERTIFICATE_PRIVATE_KEY}"
          if [ -z "${CERTIFICATE_PRIVATE_KEY_B64:-}" ] && [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "MISSING secrets — add CERTIFICATE_PRIVATE_KEY_B64 on the Application"
            exit 1
          fi

          if [ -n "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY_B64" | tr -d '\r\n\t ' | base64 --decode > "$KEY_FILE"
          else
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" | sed 's/\r//g' | sed 's/\\n/\n/g' > "$KEY_FILE"
            echo >> "$KEY_FILE"
          fi

          openssl rsa -in "$KEY_FILE" -check -noout 2>/dev/null \
            || openssl pkey -in "$KEY_FILE" -check -noout

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@file:$KEY_FILE"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true

  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm ci || npm install
          npm run build -- --base ./
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
