# Codemagic CI — Solara iOS → TestFlight
workflows:
  ios-app-store:
    name: Solara iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Build web app + Capacitor iOS sync
        script: |
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build
          npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles --archive-method ad-hoc

      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
