# Codemagic cloud Mac CI — build Solara for TestFlight / App Store
# Docs: https://docs.codemagic.io/
#
# Setup:
# 1. Push this repo to GitHub/GitLab/Bitbucket
# 2. Sign up at https://codemagic.io and connect the repo
# 3. Codemagic → Teams → Integrations → App Store Connect:
#    - Add API key (.p8), name the integration exactly: Solara
#      (or change the name under integrations: below)
# 4. Create the app once in App Store Connect (bundle id com.solara.weather)
# 5. Optional env vars in Codemagic UI (Application → Environment variables):
#    - VITE_API_BASE = https://solaraweather.com
#    - APP_STORE_APPLE_ID = 1234567890  (numeric id from App Store Connect URL)
#      Only needed for some publishing setups; leave unset if you use bundle id.
# 6. Start workflow: ios-simulator-check first, then ios-app-store

workflows:
  ios-app-store:
    name: Solara iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the integration name in Codemagic UI
      app_store_connect: Solara
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.solara.weather
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.solara.weather"
        # Do NOT put APP_STORE_APPLE_ID: "" here — empty strings fail validation.
        # If Codemagic asks for it, add a non-empty numeric value in the UI:
        #   App Store Connect → your app → App Information → Apple ID
        #   or from the URL: appstoreconnect.apple.com/apps/XXXXXXXXXX/...
      node: v22.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install
      - name: Build web + Capacitor sync
        script: |
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Upload to TestFlight after a successful archive
        submit_to_testflight: true
        # Optional: only if set as a Codemagic env var (must be non-empty digits)
        # apple_id: $APP_STORE_APPLE_ID

  # Quick compile check (no upload) — use this first
  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install & build
        script: |
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm ci || npm install
          npm run build
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
