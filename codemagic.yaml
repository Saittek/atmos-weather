# Codemagic — Solara iOS → TestFlight → App Store
# Bundle ID: com.solara.weather
# Integration name (Codemagic UI → Developer Portal): Solara
#
# Signing: NO manual CERTIFICATE_PRIVATE_KEY needed.
# Each build generates a key on the Mac VM, creates/reuses App Store
# signing files via the App Store Connect API integration, and signs the IPA.
#
# If create fails due to Apple's 3 Distribution-cert limit, the script
# deletes the oldest Distribution cert and retries (CI-only Apple account
# recommended if you also ship other apps from the same team).

workflows:
  ios-testflight:
    name: Solara → TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (no user key paste)
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"

          echo "Generating Distribution private key on this build machine..."
          openssl genrsa -out "$KEY_FILE" 2048
          openssl rsa -in "$KEY_FILE" -check -noout
          echo "Private key OK"

          free_one_distribution_cert() {
            echo "Freeing one Apple Distribution certificate slot..."
            # List certs as JSON; delete the first IOS_DISTRIBUTION id found
            if command -v jq >/dev/null 2>&1; then
              IDS=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null \
                | jq -r 'if type=="array" then .[].id elif .data then .data[].id else empty end' 2>/dev/null || true)
            else
              IDS=$(app-store-connect certificates list --type IOS_DISTRIBUTION 2>/dev/null \
                | sed -n 's/.*\([A-Z0-9]\{10,\}\).*/\1/p' | head -n 5 || true)
            fi
            for id in $IDS; do
              if [ -n "$id" ] && [ "$id" != "null" ]; then
                echo "Deleting certificate id=$id"
                app-store-connect certificates delete "$id" || true
                return 0
              fi
            done
            echo "Could not auto-delete a certificate; revoke one at:"
            echo "  https://developer.apple.com/account/resources/certificates/list"
            return 1
          }

          echo "Fetching/creating signing files for $BUNDLE_ID ..."
          set +e
          OUT=$(app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@file:$KEY_FILE" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"

          if [ $STATUS -ne 0 ]; then
            if echo "$OUT" | grep -qiE 'private key|already have|maximum|limit|Certificate'; then
              free_one_distribution_cert || true
              free_one_distribution_cert || true
              echo "Retrying fetch-signing-files..."
              app-store-connect fetch-signing-files "$BUNDLE_ID" \
                --type IOS_APP_STORE \
                --create \
                --certificate-key="@file:$KEY_FILE"
            else
              exit $STATUS
            fi
          fi

          echo "Signing files ready"

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      - name: Ensure App Store Connect app exists
        script: |
          set -euo pipefail
          # altool error 19 = no app for this bundle id on this team
          echo "Looking for App Store Connect app with bundle id $BUNDLE_ID ..."
          set +e
          LIST=$(app-store-connect apps list 2>&1)
          STATUS=$?
          set -e
          echo "$LIST" | head -n 80

          if echo "$LIST" | grep -qi "$BUNDLE_ID"; then
            echo "App record found for $BUNDLE_ID"
          else
            echo "No app matched $BUNDLE_ID in list output."
            echo "Trying to create App Store Connect app 'Solara'..."
            set +e
            CREATE=$(app-store-connect apps create \
              --name "Solara" \
              --bundle-id-sku "solara-weather" \
              --primary-locale "en-US" \
              --bundle-id "$BUNDLE_ID" \
              2>&1)
            CSTATUS=$?
            set -e
            echo "$CREATE"
            if [ $CSTATUS -ne 0 ]; then
              echo ""
              echo "============================================================"
              echo "Create the app once in App Store Connect (required):"
              echo "  1. https://appstoreconnect.apple.com → My Apps → +"
              echo "  2. Platforms: iOS"
              echo "  3. Name: Solara"
              echo "  4. Bundle ID: com.solara.weather"
              echo "     (register Identifier first if missing:"
              echo "      developer.apple.com → Identifiers → App IDs)"
              echo "  5. SKU: solara-weather-001"
              echo "  6. Create, then re-run this Codemagic build"
              echo ""
              echo "Optional: set Application env APP_STORE_APPLE_ID to the"
              echo "numeric id from the app URL:"
              echo "  appstoreconnect.apple.com/apps/XXXXXXXXXX/..."
              echo "============================================================"
              # Don't fail the build if IPA is already built — publishing will
              # still fail with a clear ASC message. Prefer explicit fail:
              exit 1
            fi
          fi

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Optional numeric App Store Connect Apple ID (from app URL / App Information).
        # Set as Codemagic Application env var APP_STORE_APPLE_ID if bundle-id lookup fails.
        # apple_id: $APP_STORE_APPLE_ID
        submit_to_testflight: true
        submit_to_app_store: false

  ios-app-store-submit:
    name: Solara → App Store review
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Solara

    environment:
      vars:
        XCODE_WORKSPACE_DIR: ios/App
        XCODE_PROJECT: App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: com.solara.weather
        VITE_API_BASE: https://solaraweather.com
      node: v22.14.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install JS dependencies
        script: |
          npm ci || npm install

      - name: Build web + Capacitor iOS
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm run build -- --base ./
          npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Automatic code signing (no user key paste)
        script: |
          set -euo pipefail
          KEY_FILE="$CM_BUILD_DIR/ios_distribution.key.pem"
          openssl genrsa -out "$KEY_FILE" 2048
          openssl rsa -in "$KEY_FILE" -check -noout

          free_one_distribution_cert() {
            if command -v jq >/dev/null 2>&1; then
              IDS=$(app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null \
                | jq -r 'if type=="array" then .[].id elif .data then .data[].id else empty end' 2>/dev/null || true)
            else
              IDS=""
            fi
            for id in $IDS; do
              if [ -n "$id" ] && [ "$id" != "null" ]; then
                app-store-connect certificates delete "$id" || true
                return 0
              fi
            done
            return 1
          }

          set +e
          OUT=$(app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@file:$KEY_FILE" 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            free_one_distribution_cert || true
            free_one_distribution_cert || true
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create \
              --certificate-key="@file:$KEY_FILE"
          fi

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing to Xcode project
        script: xcode-project use-profiles

      - name: Increment iOS build number
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          agvtool new-version -all ${PROJECT_BUILD_NUMBER:-$BUILD_NUMBER}

      - name: Build signed IPA
        script: |
          cd "$XCODE_WORKSPACE_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - Yellowknife1989@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true

  ios-simulator-check:
    name: Solara iOS compile check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.14.0
      xcode: latest
    scripts:
      - name: Install and build
        script: |
          export CAPACITOR=1
          export VITE_API_BASE="${VITE_API_BASE:-https://solaraweather.com}"
          npm ci || npm install
          npm run build -- --base ./
          npx cap sync ios
      - name: Compile for simulator
        script: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
