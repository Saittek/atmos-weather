workflows:
  ios-app-store:
    name: Solara iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_SCHEME: App
        CM_TEAM_ID: 94Y9ZFUHFD
      node: v22
      xcode: latest

    scripts:
      - name: Install JS dependencies
        script: npm ci

      - name: Build web app + Capacitor sync
        script: |
          npm run build
          npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles --team-id "$CM_TEAM_ID"
          cat > export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$CM_TEAM_ID</string>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme "$XCODE_SCHEME" --export-options-plist export_options.plist

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
