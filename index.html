<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="description" content="Solara — live weather radar, hurricane tracker, forecasts, air quality, and severe alerts for the US and Canada." />
    <meta name="theme-color" content="#060a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Solara" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Solara" />
    <link rel="canonical" href="https://solaraweather.com/" />
    <meta property="og:title" content="Solara — Weather, Radar &amp; Hurricane Tracker" />
    <meta property="og:description" content="Live radar, 3D Earth hurricane tracks, forecasts, and alerts. Free weather command center." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://solaraweather.com/" />
    <meta property="og:image" content="https://solaraweather.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solara — Weather" />
    <meta name="twitter:description" content="Live radar, hurricane tracker, forecasts, and severe alerts." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Solara — Weather, Radar &amp; Hurricane Tracker</title>
    <!--
      AdSense is injected after idle from main.tsx (loadAdSenseDeferred)
      so mobile first paint isn't competing with ads JS.
    -->
    <!-- System UI fonts first; desktop still gets DM Sans below -->
    <style>
      html.system-fonts body,
      html.system-fonts button,
      html.system-fonts input,
      html.system-fonts select {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      }
    </style>
    <!-- Desktop-only web fonts (skipped when .system-fonts is set on <html>) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" media="(min-width: 721px)" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin media="(min-width: 721px)" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media=window.matchMedia('(min-width:721px)').matches?'all':'not all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
