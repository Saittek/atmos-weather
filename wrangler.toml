# Cloudflare Pages / Workers Static Assets deploy
# SPA routes (/radar, /widget, etc.) use not_found_handling below
# instead of a /* → /index.html rewrite (which errors with code 100324).

name = "atmos-weather"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
# Serve index.html for client-side React Router paths
not_found_handling = "single-page-application"
# Don't run a Worker for every request — pure static + SPA fallback
run_worker_first = false
