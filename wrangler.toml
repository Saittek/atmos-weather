# Solara — SPA + API on one Worker (static assets + /api/*)
# SPA routes use not_found_handling (do NOT use /* → index.html in _redirects).

name = "atmos-weather"
main = "worker/index.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
# Serve index.html for client-side React Router paths
not_found_handling = "single-page-application"
# Only invoke Worker for API; static files served directly
run_worker_first = ["/api/*"]
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "atmos-db"
database_id = "4c902a95-fbfb-4fb8-b682-735d786bfc97"
migrations_dir = "migrations"

# Public VAPID key (safe to expose). Private key is a secret: VAPID_PRIVATE_KEY
[vars]
VAPID_PUBLIC_KEY = "BL2kQvsIciHjcDJJRqnvB8u-SCwqt6eaL0IKneuvq2INHjOvjFXDFl6Kv2YW1d1uIBvsqJFiG4_Y_IhU2606qXw"
VAPID_SUBJECT = "mailto:yellowknife1989@gmail.com"

# Check saved places for severe alerts every 10 minutes
[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
